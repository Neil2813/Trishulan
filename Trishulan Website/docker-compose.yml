version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trishulan_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trishulan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trishulan_secret}
      POSTGRES_DB: ${POSTGRES_DB:-trishulan_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trishulan -d trishulan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trishulan_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trishulan_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trishulan}:${POSTGRES_PASSWORD:-trishulan_secret}@postgres:5432/${POSTGRES_DB:-trishulan_db}?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trishulan_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
